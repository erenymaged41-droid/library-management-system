<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library System - Catalog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Library Catalog</h2>
    
    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search by book title or author...">
    </div>

    <div id="booksGrid" class="books-grid">
      <div class="book-card">
        <h3 class="book-title">Clean Code</h3>
        <p class="book-author">By Robert C. Martin</p>
        <button class="borrow-btn">Borrow</button>
      </div>

      <div class="book-card">
        <h3 class="book-title">The Pragmatic Programmer</h3>
        <p class="book-author">By Andrew Hunt</p>
        <button class="borrow-btn">Borrow</button>
      </div>

      <div class="book-card">
        <h3 class="book-title">JavaScript: The Good Parts</h3>
        <p class="book-author">By Douglas Crockford</p>
        <button class="borrow-btn">Borrow</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
                                             </html>
