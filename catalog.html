<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج الكتب</title>
</head>
<body>

    <h2>كتالوج المكتبة</h2>

    <div>
        <input type="text" id="searchInput" placeholder="ابحث باسم الكتاب أو المؤلف...">
    </div>
    <br>

    <div id="booksGrid">
        
        <div class="book-card">
            <h3 class="book-title">مقدمة في لغة بايثون</h3>
            <p>المؤلف: <span class="book-author">أحمد محمود</span></p>
            <p>النسخ المتاحة: 3</p>
            <button>استعارة</button>
        </div>
        <hr>

        <div class="book-card">
            <h3 class="book-title">تعلم إطار عمل جانجو</h3>
            <p>المؤلف: <span class="book-author">سارة علي</span></p>
            <p>النسخ المتاحة: 0</p>
            <button disabled>غير متاح</button>
        </div>
        <hr>

        <div class="book-card">
            <h3 class="book-title">أساسيات الجافاسكريبت</h3>
            <p>المؤلف: <span class="book-author">محمد حسن</span></p>
            <p>النسخ المتاحة: 5</p>
            <button>استعارة</button>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
