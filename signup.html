<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
</head>
<body>

    <h2>إنشاء حساب جديد</h2>

    <form id="signupForm">
        <div>
            <label for="fullNameInput">الاسم بالكامل:</label><br>
            <input type="text" id="fullNameInput" name="fullName">
            <span id="fullNameError" style="color: red;"></span>
        </div>
        <br>
        <div>
            <label for="emailInput">البريد الإلكتروني:</label><br>
            <input type="email" id="emailInput" name="email">
            <span id="emailError" style="color: red;"></span>
        </div>
        <br>
        <div>
            <label for="passwordInput">كلمة السر:</label><br>
            <input type="password" id="passwordInput" name="password">
            <span id="passwordError" style="color: red;"></span>
        </div>
        <br>
        <button type="submit">تسجيل الحساب</button>
    </form>

    <script src="main.js"></script>
</body>
</html>
