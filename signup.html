      <h2 style="text-align: center; margin-bottom: 1.5rem; color: #4A3525;">تسجيل الدخول</h2>
      
      <form style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #4A3525;">البريد الإلكتروني</label>
          <input type="email" placeholder="example@domain.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px;" required>
        </div>
        
        <div>
          <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #4A3525;">كلمة المرور</label>
