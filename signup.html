<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library System - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Create New Account</h2>
    
    <form id="signupForm">
      <div class="form-group">
        <label for="fullNameInput">Full Name:</label>
        <input type="text" id="fullNameInput" placeholder="Enter your full name">
        <small class="error-msg" id="fullNameError"></small>
      </div>

      <div class="form-group">
        <label for="emailInput">Email Address:</label>
        <input type="email" id="emailInput" placeholder="Enter your email">
        <small class="error-msg" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password:</label>
        <input type="password" id="passwordInput" placeholder="Enter your password">
        <small class="error-msg" id="passwordError"></small>
      </div>

      <button type="submit" id="signupBtn">Sign Up</button>
    </form>
  </div>

  <script src="main.js"></script>
</body>
</html>
