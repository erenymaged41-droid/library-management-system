<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعاراتي - مكتبة رُفُوف</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* إصلاح الهيدر والـ Navbar لتنسيق مثالي */
    .navbar {
      background-color: #FDFBF7;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #E8DEC8;
    }
    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-links {
      display: flex;
      list-style: none;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      text-decoration: none;
      color: #4A3525;
      font-weight: bold;
      font-size: 1rem;
    }
    .nav-links a.active {
      color: #2D7D56;
    }
    
    /* تنسيق الكارت والزر */
    .my-loans-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .loan-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      border: 1px solid #E8DEC8;
    }
    .book-title {
      color: #2D251E;
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .book-author {
      color: #7A6855;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    .return-date {
      color: #E74C3C;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .btn-return {
      background-color: #E74C3C;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-return:hover {
      background-color: #C0392B;
    }
  </style>
</head>
<body>

  <!-- Navbar المضبوط بالكامل -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo-container">
        <svg width="48" height="48" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="80" cy="70" r="45" fill="#E8DEC8"/>
          <rect x="35" y="42" width="90" height="6" rx="3" fill="#8C533E"/>
          <rect x="35" y="92" width="90" height="7" rx="3" fill="#8C533E"/>
          <rect x="44" y="48" width="10" height="44" rx="2" fill="#B83B26"/>
          <rect x="46" y="53" width="6" height="4" fill="#FFFFFF" opacity="0.6"/>
          <rect x="56" y="48" width="10" height="44" rx="2" fill="#2D7D56"/>
          <rect x="68" y="48" width="9" height="44" rx="2" fill="#E9C46A"/>
          <rect x="70" y="68" width="5" height="4" fill="#8C533E"/>
          <rect x="79" y="48" width="9" height="44" rx="2" fill="#2A9D8F"/>
          <rect x="81" y="55" width="5" height="5" fill="#FFFFFF"/>
          <rect x="90" y="48" width="10" height="44" rx="2" fill="#1D3557"/>
          <rect x="92" y="62" width="6" height="3" fill="#E9C46A"/>
          <rect x="102" y="48" width="10" height="44" rx="2" fill="#E76F51"/>
        </svg>

        <div style="display: flex; flex-direction: column; text-align: right;">
          <span style="color: #4A3525; font-weight: bold; font-size: 1.2rem; line-height: 1;">رُفُوف</span>
          <span style="color: #7A6855; font-size: 0.65rem; font-weight: 500; margin-top: 3px;">مكتبتك في مكان واحد</span>
        </div>
      </div>
      
      <ul class="nav-links">
        <li><a href="catalog.html">الكتالوج</a></li>
        <li><a href="my_loans.html" class="active">استعاراتي</a></li>
        <li><a href="signup.html">تسجيل الدخول</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="my-loans-container">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="color: #4A3525; font-size: 1.5rem;">قائمة الكتب المستعارة</h2>
    </div>

    <div class="loan-card">
      <div class="book-title">لأنك الله (الجزء الأول والثاني)</div>
      <div class="book-author">المؤلف: علي جابر الفيفي</div>
      <div class="return-date">تاريخ الإرجاع: 15 سبتمبر 2026</div>
      <button class="btn-return">إرجاع الكتاب</button>
    </div>
  </main>

  <footer class="footer" style="text-align: center; padding: 1.5rem; color: #7A6855; font-size: 0.85rem;">
    <p>جميع الحقوق محفوظة &copy; 2026 - مكتبة رُفُوف</p>
  </footer>

</body>
  </html>
